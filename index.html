si:{title:"ඔලිඳ කෙළිය",sub:"සාම්ප්‍රදායික ශ්‍රී ලාංකික බීජ ක්‍රීඩාව · ඔබ පහළ පේළිය ක්‍රීඩා කරයි",you:"ඔබ",bot:"පරිගණකය",p1:"ක්‍රීඩක 1",p2:"ක්‍රීඩක 2",nw:"නව ක්‍රීඩාව",un:"පසුපසට",hi:"ඉඟිය",sh:"බෙදාගන්න",m_bot:"පරිගණකයට එරෙහිව",m_two:"ක්‍රීඩකයන් 2ක්",l_e:"පහසු",l_m:"මධ්‍යම",l_h:"අමාරු",yt:"ඔබේ වාරය: ඔබේ පැත්තේ වළක් තෝරන්න.",bt:"පරිගණකයේ වාරය…",p1t:"ක්‍රීඩක 1ගේ වාරය (පහළ)",p2t:"ක්‍රීඩක 2ගේ වාරය (ඉහළ)",sow:"දමමින්…",hy:"ඔබේ අතේ බීජ: ",hb:"පරිගණකයේ අතේ බීජ: ",h1:"ක්‍රීඩක 1ගේ අතේ: ",h2:"ක්‍රීඩක 2ගේ අතේ: ",w:"ඔබ දිනුවා",l:"පරිගණකය දිනුවා",d:"සමසම",p1w:"ක්‍රීඩක 1 දිනුවා",p2w:"ක්‍රීඩක 2 දිනුවා",sw:"ජය",sl:"පරාජය",sd:"සමසම",sb:"හොඳම ජය පෙළ",rules:"මෙහි භාවිත නීති",ok:"පිටපත් කළා!",no:"බෙදාගත නොහැකි විය",m_on:"මිතුරා සමඟ (ඔන්ලයින්)",n_create:"කාමරයක් සාදන්න",n_join:"එක්වන්න",n_ph:"කාමර කේතය",n_wait:"කාමරයක් සාදන්න, නැතහොත් මිතුරාගේ කේතය ඇතුළත් කර එක්වන්න ඔබන්න.",n_share:"කාමරය සූදානම්! ඔබේ මිතුරාට මෙම කේතය දෙන්න: ",n_conn:"සම්බන්ධ විය! කාමරය සාදන්නා මුලින්ම ක්‍රීඩා කරයි.",n_left:"ඔබේ මිතුරා ක්‍රීඩාවෙන් ඉවත් විය.",n_err:"සම්බන්ධතා ගැටලුවක්",opp:"ප්‍රතිවාදියා",ot:"ප්‍රතිවාදියාගේ වාරය…",ow:"ප්‍රතිවාදියා දිනුවා",ho:"ප්‍රතිවාදියාගේ අතේ බීජ: ",rt:"වළවල් 14ක් (එක් ක්‍රීඩකයෙකුට 7), සෑම වළකම බීජ 4ක් (මුළු බීජ 56). ඔබේ වළක් තෝරා, බීජ සියල්ල ගෙන වාමාවර්තව එකින් එක දමන්න. අවසාන බීජය බීජ ඇති වළකට වැටුණොත් ඒ වළේ බීජ ගෙන දිගටම දමන්න. අවසාන බීජය හිස් වළකට වැටුණොත් ඊළඟ වළේ බීජ අල්ලා ගන්න; වාරය අවසන්. ක්‍රීඩකයෙකුගේ පැත්තේ බීජ නැති විට ක්‍රීඩාව අවසන් වේ; ඉතිරි බීජ ඒ ඒ පැත්තේ හිමිකරුට. වැඩිම බීජ ඇති අය දිනයි."}};
let lang="en",st,view=null,busy=false,tmr,hist=[],hintPit=-1,muted=false,stats={w:0,l:0,d:0,s:0,b:0},ac,peer=null,conn=null,me=0,flipped=false;
const tr=k=>T[lang][k];
function sget(k,def){try{const v=localStorage.getItem(k);return v===null?def:v}catch(e){return def}}

function tone(f,d,ty,v){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=ty||"sine";o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(v||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d)}catch(e){}}

function fresh(){return{b:Array(N).fill(4),s:[0,0],turn:0,over:false,last:null}}
function clone(x){return{b:x.b.slice(),s:x.s.slice(),turn:x.turn,over:x.over,last:x.last}}
function legal(x){const r=[];for(let i=0;i<N;i++)if(own(i)==x.turn&&x.b[i]>0)r.push(i);return r}
function fin(x){let a=x.s[0],c=x.s[1];for(let i=0;i<N;i++)own(i)?c+=x.b[i]:a+=x.b[i];return[a,c]}
function play(x,pit,fr){
  const b=x.b,p=x.turn,snap=(h,k)=>fr&&fr.push({b:b.slice(),s:x.s.slice(),hl:h,hand:hand,p:p,k:k});
  let pos=pit,hand=b[pit],g=0;b[pit]=0;x.last={pit:pit,cap:-1};snap(pit,0);

    while(hand>0){pos=(pos+1)%N;b[pos]++;hand--;snap(pos,1)}

function ev(x){if(x.over){const f=fin(x);return(f[1]-f[0])*10}return x.s[1]-x.s[0]}
function mm(x,d,a,b){
  if(d==0||x.over)return ev(x);
  let best=x.turn==1?-1e9:1e9;
  for(const m of legal(x)){
    const c=clone(x);play(c,m);const v=mm(c,d-1,a,b);
    if(x.turn==1){best=Math.max(best,v);a=Math.max(a,v)}else{best=Math.min(best,v);b=Math.min(b,v)}

  }
  return best;
}
function best(x,depth){
  let bv=null,bs=[];

  return bs[Math.random()*bs.length|0];
}

}

    e.classList.toggle("hl",!!view&&view.hl==i&&view.k!=2);
    e.classList.toggle("capf",!!view&&view.hl==i&&view.k==2);
    e.classList.toggle("last",!view&&!!L&&L.pit==i);
    e.classList.toggle("lcap",!view&&!!L&&L.cap==i);
    e.classList.toggle("hint",!view&&hintPit==i);
    e.disabled=busy||st.over||st.b[i]==0||own(i)!=st.turn||!human(st.turn);
  }
  const on=mode()=="online";$("l0").textContent=two?tr("p1"):tr("you");$("l1").textContent=two?tr("p2"):on?tr("opp"):tr("bot");
  $("s0").textContent=v.s[on?me:0];$("s1").textContent=v.s[on?1-me:1];
  $("hand").innerHTML=view?(two?(view.p==0?tr("h1"):tr("h2")):(view.p==(on?me:0)?tr("hy"):(on?tr("ho"):tr("hb"))))+view.hand+" "+"<i></i>".repeat(Math.min(view.hand,20)):"";
  let t;
  if(st.over&&!view){const f=fin(st),m=on?me:0,a=f[m],c=f[1-m],sc=" "+(two?f[0]:a)+"–"+(two?f[1]:c)+".";t=a==c?tr("d")+sc:a>c?(two?tr("p1w"):tr("w"))+sc:(two?tr("p2w"):on?tr("ow"):tr("l"))+sc}
  else if(view)t=tr("sow");
  else if(on&&!(conn&&conn.open))t=tr("n_wait");else t=two?(st.turn==0?tr("p1t"):tr("p2t")):st.turn==(on?me:0)?tr("yt"):on?tr("ot"):tr("bt");
  $("st").textContent=t;
  $("undo").disabled=busy||!hist.length||st.over||on;
  $("hint").disabled=busy||st.over||!human(st.turn);
  statsTxt();
}
function endGame(){
  const f=fin(st);
  if(mode()=="bot"){
    if(f[0]>f[1]){stats.w++;stats.s++;stats.b=Math.max(stats.b,stats.s)}else if(f[0]<f[1]){stats.l++;stats.s=0}else stats.d++;
    sset("olinda-stats",JSON.stringify(stats));
  }
  if(mode()=="two"||f[mode()=="online"?me:0]>f[mode()=="online"?1-me:1]){[523,659,784,1047].forEach((n,i)=>setTimeout(()=>tone(n,.25,"sine",.1),i*140))}
  else tone(180,.4,"triangle",.1);
  draw();
}
function doMove(m,human){
  hintPit=-1;if(human){hist.push(clone(st));if(mode()=="online"&&conn&&conn.open)conn.send({t:"mv",m:m})}
  busy=true;const fr=[];play(st,m,fr);let k=0;
  (function step(){
    view=fr[k++];sfx(view.k);draw();
    if(k<fr.length)tmr=setTimeout(step,k<2?350:200);
    else{view=null;busy=false;draw();if(st.over)endGame();else next()}
  })();
}
function next(){if(st.over||st.turn!=1||mode()!="bot")return;busy=true;draw();tmr=setTimeout(()=>doMove(botMove(),false),600)}
function click(i){if(busy||st.over||own(i)!=st.turn||st.b[i]==0||!human(st.turn))return;doMove(i,true)}
function reset(){clearTimeout(tmr);st=fresh();view=null;busy=false;hist=[];hintPit=-1;draw()}
function undo(){if(busy||!hist.length||st.over)return;st=hist.pop();hintPit=-1;view=null;draw()}
function toast(k){$("toast").textContent=tr(k);setTimeout(()=>$("toast").textContent="",2500)}
async function share(){
  const f=fin(st),txt=(st.over?"Olinda Keliya "+f[0]+"–"+f[1]+"! ":"Try Olinda Keliya! ")+location.href;
  try{if(navigator.share){await navigator.share({text:txt});return}await navigator.clipboard.writeText(txt);toast("ok")}catch(e){toast("no")}
}
function setFlip(f){flipped=f;$("top").innerHTML="";$("bot").innerHTML="";build();if(st)draw()}
function netMsg(t){$("netmsg").textContent=t}
function netClose(){try{conn&&conn.close()}catch(e){}try{peer&&peer.destroy()}catch(e){}conn=null;peer=null;me=0;if(flipped)setFlip(false)}
function newCode(){const a="ABCDEFGHJKMNPQRSTUVWXYZ23456789";let c="";for(let i=0;i<5;i++)c+=a[Math.random()*a.length|0];return c}
function wire(c){
  c.on("open",()=>{if(conn===c){netMsg(tr("n_conn"));reset()}});
  c.on("data",d=>{if(conn!==c||!d)return;if(d.t=="mv")recv(d.m);else if(d.t=="new")reset()});
  c.on("close",()=>{if(conn===c){netMsg(tr("n_left"));conn=null;draw()}});
}
function recv(m){
  if(busy){setTimeout(()=>recv(m),200);return}
  if(typeof m!="number"||st.over||st.turn==me||own(m)!=st.turn||!(st.b[m]>0))return;
  doMove(m,false);
}
function host(){
  netClose();
  if(typeof Peer=="undefined"){netMsg(tr("n_err"));return}
  const code=newCode();peer=new Peer("olinda-"+code);me=0;
  peer.on("open",()=>netMsg(tr("n_share")+code));
  peer.on("connection",c=>{if(conn){c.close();return}conn=c;wire(c)});
  peer.on("error",e=>netMsg(tr("n_err")+" ("+e.type+")"));
  reset();
}
function join(){
  const code=$("joincode").value.trim().toUpperCase();if(!code)return;
  netClose();
  if(typeof Peer=="undefined"){netMsg(tr("n_err"));return}
  me=1;setFlip(true);peer=new Peer();
  peer.on("open",()=>{conn=peer.connect("olinda-"+code,{reliable:true});wire(conn)});
  peer.on("error",e=>netMsg(tr("n_err")+" ("+e.type+")"));
  reset();
}
function i18n(){
  document.documentElement.lang=lang=="si"?"si":"en";
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=tr(e.dataset.i));
  document.title=tr("title");
  document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=tr(e.dataset.ph));
}
$("new").onclick=()=>{reset();if(mode()=="online"&&conn&&conn.open)conn.send({t:"new"})};$("mk").onclick=host;$("jn").onclick=join;$("undo").onclick=undo;$("share").onclick=share;
$("hint").onclick=()=>{if(busy||st.over||!human(st.turn))return;hintPit=best(st,5);draw()};
$("mode").onchange=()=>{netClose();$("net").style.display=mode()=="online"?"flex":"none";netMsg("");reset()};$("lv").onchange=reset;
$("lang").onclick=()=>{lang=lang=="en"?"si":"en";sset("olinda-lang",lang);i18n();draw()};
$("mute").onclick=()=>{muted=!muted;sset("olinda-mute",muted?"1":"0");$("mute").textContent=muted?"🔇":"🔊"};
$("fest").onclick=()=>{const on=document.body.dataset.fest!="1";document.body.dataset.fest=on?"1":"0";sset("olinda-fest",on?"1":"0")};
try{const s=JSON.parse(sget("olinda-stats","null"));if(s)stats=s}catch(e){}
lang=sget("olinda-lang","en")=="si"?"si":"en";muted=sget("olinda-mute","0")=="1";$("mute").textContent=muted?"🔇":"🔊";
document.body.dataset.fest=sget("olinda-fest","0");
(function(){let s='<svg viewBox="0 0 100 100" width="64" height="64" fill="none" stroke="#c98b3f" stroke-width="1.6"><circle cx="50" cy="50" r="47"/><circle cx="50" cy="50" r="31"/><circle cx="50" cy="50" r="12" fill="#c98b3f"/>';
for(let i=0;i<16;i++)s+='<ellipse cx="50" cy="11" rx="4" ry="7" transform="rotate('+i*22.5+' 50 50)"/>';
for(let i=0;i<8;i++)s+='<ellipse cx="50" cy="29" rx="3.5" ry="8" transform="rotate('+(i*45+22.5)+' 50 50)"/>';
$("moon").innerHTML=s+'</svg>'})();
build();i18n();reset();
</script></body></html>
